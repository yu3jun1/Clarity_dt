[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-rrt-ensemble"
version = "0.3.0"
description = "CLARITY pure stage-wise recursive transition and dynamics ensemble experiment"
requires-python = ">=3.10,<3.11"
dependencies = [
  "numpy",
  "pandas",
  "PyYAML",
  "torch",
  "nibabel",
  "scikit-survival",
  "transformers>=4.40",
  "peft>=0.10",
  "accelerate>=0.30",
  "bitsandbytes>=0.43",
  "monai>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
